async function api(url){
  const r = await fetch('/net?u=' + encodeURIComponent(url));
  if (r.status === 204) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.error)) || ('HTTP ' + r.status));
  return j;
}
async function loadStats(){
  const box = $('#stats'); if (!box || !S.statsSrc) return;
  const src = S.statsSrc, key = src + ':' + (src === 'lfm' ? S.acc.lfm.user : S.acc.lb.user);
  if (S.stats[key] && Date.now() - S.stats[key].at < 120000){ box.innerHTML = statsHTML(S.stats[key]); return; }
  try {
    let data;
    if (src === 'lfm'){
      const u = S.acc.lfm.user, base = `https://ws.audioscrobbler.com/2.0/?format=json&api_key=${encodeURIComponent(S.acc.lfm.key)}&user=${encodeURIComponent(u)}&method=`;
      const [info, recent, top] = await Promise.all([
        api(base + 'user.getinfo').catch(() => null),
        api(base + 'user.getrecenttracks&limit=20'),
        api(base + 'user.gettopartists&period=7day&limit=8').catch(() => null)
      ]);
      const tr = [].concat((recent && recent.recenttracks && recent.recenttracks.track) || []);
      data = {
        total: info && info.user ? +info.user.playcount : null,
        recent: tr.map(t => ({ artist: (t.artist && (t.artist['#text'] || t.artist.name)) || '', title: t.name, album: t.album && t.album['#text'], ts: t.date ? +t.date.uts : 0, now: !!(t['@attr'] && t['@attr'].nowplaying) })),
        top: [].concat((top && top.topartists && top.topartists.artist) || []).map(x => ({ name: x.name, n: +x.playcount }))
      };
    } else {
      const u = encodeURIComponent(S.acc.lb.user), base = 'https://api.listenbrainz.org/1/';
      const [count, listens, top] = await Promise.all([
        api(base + `user/${u}/listen-count`).catch(() => null),
        api(base + `user/${u}/listens?count=20`),
        api(base + `stats/user/${u}/artists?range=week&count=8`).catch(() => null)
      ]);
      data = {
        total: count && count.payload ? count.payload.count : null,
        recent: ((listens && listens.payload && listens.payload.listens) || []).map(l => ({ artist: l.track_metadata.artist_name, title: l.track_metadata.track_name, album: l.track_metadata.release_name, ts: l.listened_at, now: false })),
        top: ((top && top.payload && top.payload.artists) || []).map(x => ({ name: x.artist_name, n: x.listen_count })),
        topPending: !top
      };
    }
    data.at = Date.now(); S.stats[key] = data;
    if (S.view === 'profile' && S.statsSrc === src && $('#stats')) $('#stats').innerHTML = statsHTML(data);
  } catch (e) {
    if ($('#stats')) $('#stats').innerHTML = `<p class="err">Statistiques indisponibles (${esc(e.message || 'réseau')}). Vérifie ta connexion internet.</p>`;
  }
}
function statsHTML(d){
  const max = Math.max(1, ...d.top.map(x => x.n));
  const recentId = regList([]);
  const recent = d.recent.map((r, k) => {
    const local = S.songKey.get(norm(r.artist) + '|' + norm(r.title)) || rtrack({ title: r.title, artist: r.artist, album: r.album });
    if (local) S.lists.get(recentId)[k] = local;
    return `<div class="row"${local ? ` data-list="${recentId}" data-i="${k}" data-id="${esc(local.id)}"` : ''}>${local ? cover(local, local.album, 'sm') : cover(null, r.album || r.title, 'sm')}
      <div class="rm"><b>${esc(r.title)}</b><span>${r.now ? '<span class="live">EN COURS</span>' : ''}${esc(r.artist)}</span></div>
      <span class="dur">${r.ts ? rel(r.ts) : ''}</span></div>`;
  }).join('');
  return `${d.total != null ? `<div class="stat-n">${nf.format(d.total)}<small>écoutes au total</small></div>` : ''}
    <section class="blk"><div class="blk-h"><h2>Top artistes · 7 jours</h2></div>
      ${d.top.length ? `<div class="bars">${d.top.map(x => { const a = artistOf(x.name); return `<button class="barrow${a ? ' local' : ''}" ${a ? `data-go="artist:${esc(a.key)}"` : 'disabled'} style="--w:${Math.round(x.n / max * 100)}%"><b>${esc(x.name)}</b><em>${plural(x.n, 'écoute')}</em><i></i></button>`; }).join('')}</div>`
        : `<p class="muted">${d.topPending ? 'ListenBrainz calcule tes statistiques une fois par jour : reviens demain.' : 'Pas encore d\'écoutes cette semaine.'}</p>`}
    </section>
    <section class="blk"><div class="blk-h"><h2>Écoutes récentes</h2></div>
      ${recent ? `<div class="rows">${recent}</div>` : '<p class="muted">Aucune écoute pour l\'instant.</p>'}
    </section>`;
}

function submitForm(form){
  const kind = form.dataset.form;
  if (kind === 'yt'){
    const k = $('#ytKeyIn').value.trim(), err = $('#ytErr'), b = $('#ytBtn');
    if (!/^AIza[0-9A-Za-z_\-]{30,}$/.test(k)){ err.textContent = 'Une clé API YouTube commence par « AIza » et fait 39 caractères. Vérifie la copie.'; err.hidden = false; return; }
    err.hidden = true; b.disabled = true; b.textContent = 'Vérification…';
    const oldManual = ytManual() ? ytKey() : '';
    window.__ytKey = k; N && N.setYoutubeKey(k);
    ytApi('videos', { part: 'id', id: 'jNQXAC9IVRw' }).then(() => { S.ytForm = false; window.__ytKey = N ? '' : k; toast('Clé YouTube enregistrée'); render(window.scrollY); }, e => {
      window.__ytKey = N ? '' : oldManual; N && N.setYoutubeKey(oldManual);
      err.textContent = e.code === 'net' ? e.message : 'Clé refusée par YouTube : vérifie la copie, et que « YouTube Data API v3 » est bien activée.';
      err.hidden = false; b.disabled = false; b.textContent = 'Enregistrer la clé';
    });
    return;
  }
  if (!N){ toast('Disponible dans l\'appli Android.'); return; }
  if (kind === 'lfm'){
    const key = $('#lfmKey').value.trim(), secret = $('#lfmSecret').value.trim(), user = $('#lfmUser').value.trim(), pass = $('#lfmPass').value;
    S.form = { key, secret, user };
    const err = $('#lfmErr');
    if (!key || !secret || !user || !pass){ err.textContent = 'Remplis les quatre champs.'; err.hidden = false; return; }
    if (!/^[0-9a-f]{32}$/i.test(key) || !/^[0-9a-f]{32}$/i.test(secret)){ err.textContent = 'La clé API et le secret font chacun 32 caractères (chiffres et lettres a à f). Vérifie la copie.'; err.hidden = false; return; }
    err.hidden = true; const b = $('#lfmBtn'); b.disabled = true; b.textContent = 'Connexion…';
    N.lastfmLogin(key, secret, user, pass);
  } else {
    const token = $('#lbToken').value.trim(), err = $('#lbErr');
    if (!token){ err.textContent = 'Colle ton jeton ListenBrainz.'; err.hidden = false; return; }
    err.hidden = true; const b = $('#lbBtn'); b.disabled = true; b.textContent = 'Vérification…';
    N.listenbrainzLogin(token);
  }
}

/* ======================================================================
   Actions (un seul gestionnaire de clics)
   ====================================================================== */
const ACTS = {
  back: () => back(),
  askPermission: () => N && N.requestPermission(),
  appSettings: () => N && N.openAppSettings(),
  rescan: () => { if (!N) return; if (!N.hasPermission()){ N.requestPermission(); return; } $('#main').innerHTML = `<div class="empty"><div class="spin"></div><span>Recherche de ta musique…</span></div>`; N.scan(true); },
  openPlayer: () => openPlayer(),
  closePlayer: () => closePlayer(),
  toggle: () => togglePlay(),
  next: () => E && E.next(),
  prev: () => E && E.previous(),
  shuffle: () => toggleShuffle(),
  repeat: () => cycleRepeat(),
  favCurrent: () => toggleFav(cur()),
  menuCurrent: () => trackMenu(cur()),
  artistCurrent: () => { const t = cur(), a = t && artistOf(t.artist); if (a){ closePlayer(); nav('artist', { key: a.key }); } },
  openQueue: () => openQueue(),
  closeSheet: () => closeSheet(),
  shuffleAll: () => playList(S.tracks, -1, true),
  mixRemote: () => { const pool = remotePool(); if (pool.length) playList(pool, -1, true); else toast('Pas encore de titres : écoute de la musique avec tes comptes reliés.'); },
  reloadRemote: () => { S.remote = {}; render(window.scrollY); },
  ytSearch: () => runYtSearch(),
  shuffleLib: () => playList(S.libList, -1, true),
  playList: el => playList(S.lists.get(el.dataset.list), 0, false),
  shuffleList: el => playList(S.lists.get(el.dataset.list), -1, true),
  allArtistTracks: () => { const a = S.artistByKey.get(S.params.key); if (a){ S.libList = null; nav('artistTracks', { key: a.key }); } },
  menu: el => { const r = el.closest('.row'); const list = S.lists.get(r.dataset.list); trackMenu(list && list[+r.dataset.i]); },
  mNext: () => { playNext(S.menuTrack); closeSheet(); },
  mQueue: () => { addToQueue(S.menuTrack); closeSheet(); },
  mFav: () => { toggleFav(S.menuTrack); closeSheet(); if (S.view === 'library') render(window.scrollY); },
  mAlbum: () => { const t = S.menuTrack; closeSheet(); closePlayer(); if (t && S.albumById.has(t.alId)) nav('album', { id: t.alId }); },
  mArtist: () => { const t = S.menuTrack, a = t && artistOf(t.artist); closeSheet(); closePlayer(); if (a) nav('artist', { key: a.key }); },
  qRemove: el => { const k = +el.dataset.k; E.removeAt(k); S.queue.splice(k, 1); openQueue(); },
  qClear: () => { E.replaceUpcoming('[]'); S.queue = S.queue.slice(0, (S.p.i || 0) + 1); openQueue(); },
  ytRemoveKey: () => { N && N.setYoutubeKey(''); window.__ytKey = ''; render(window.scrollY); },
  ytOtherKey: () => { S.ytForm = true; render(window.scrollY); },
  ytCancel: () => { S.ytForm = false; render(window.scrollY); },
  vMode: el => { S.video.mode = el.dataset.m; saveVideo(); render(window.scrollY); layoutYT(); },
  vCorner: el => { S.video.corner = el.dataset.c; saveVideo(); $$('[data-act=vCorner]').forEach(b => b.setAttribute('aria-pressed', b === el)); layoutYT(); },
  libTab: el => { S.libTab = el.dataset.tab; store.set('libTab', S.libTab); S.params = { tab: S.libTab }; render(); },
  toggleScrob: el => { N && N.setScrobbling(el.dataset.s, el.checked); loadAccounts(); },
  logout: el => openSheet(`<div class="sheet-head"><div class="rm"><b>Déconnecter ${el.dataset.s === 'lfm' ? 'Last.fm' : 'ListenBrainz'} ?</b><span>Les écoutes en attente pour ce compte ne seront pas envoyées.</span></div></div>
    <button class="mi" data-act="logoutYes" data-s="${el.dataset.s}">${ic('x')}Déconnecter</button><button class="mi" data-act="closeSheet">${ic('back')}Annuler</button>`, 'confirm'),
  logoutYes: el => { closeSheet(); N && N.logout(el.dataset.s); },
  relogin: el => { N && N.logout(el.dataset.s); },
  flush: el => { el.disabled = true; el.textContent = 'Envoi…'; N && N.flush(); },
  ext: el => { const u = el.dataset.url; if (N) N.openUrl(u); else window.open(u, '_blank'); },
  statsSrc: el => { S.statsSrc = el.dataset.s; $$('[data-act=statsSrc]').forEach(b => b.setAttribute('aria-selected', b === el)); $('#stats').innerHTML = '<div class="spin"></div>'; loadStats(); }
};
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if (act && act.tagName !== 'SELECT' && act.type !== 'checkbox'){
    const f = ACTS[act.dataset.act];
    if (f){ e.stopPropagation(); f(act, e); return; }
  }
  const go = e.target.closest('[data-go]');
  if (go){
    const [v, p] = go.dataset.go.split(/:(.*)/s);
    if (v === 'album') nav('album', { id: p });
    else if (v === 'rlist') nav('rlist', { key: p });
    else if (v === 'playlist') nav('playlist', { mbid: p });
    else if (v === 'artist') nav('artist', { key: p });
    else if (v === 'library'){ if (p){ S.libTab = p; store.set('libTab', p); } nav('library', { tab: S.libTab }); }
    else { if (v === S.view && !S.stack.length){ window.scrollTo({ top: 0, behavior: 'smooth' }); return; } nav(v); }
    return;
  }
  const r = e.target.closest('.row[data-list], .tcard[data-list]');
  if (r){
    const list = S.lists.get(r.dataset.list), i = +r.dataset.i;
    if (!list || !list[i]) return;
    if (r.dataset.q){ E && E.skipTo(i); return; }
    // La liste peut contenir des trous (écoutes récentes sans fichier local)
    const clean = list.filter(Boolean);
    playList(clean, clean.indexOf(list[i]), S.shuffle);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'libSort'){ S.libSort[S.params.tab || S.libTab] = t.value; store.set('libSort', S.libSort); render(); }
  if (t.dataset.act === 'toggleScrob') ACTS.toggleScrob(t);
  if (t.dataset.act === 'vFrame'){ S.video.frame = t.checked; saveVideo(); layoutYT(); }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (f){ e.preventDefault(); submitForm(f); } });
let searchT = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.query = e.target.value;
  clearTimeout(searchT);
  searchT = setTimeout(() => { $('#results').innerHTML = searchResults(S.query); $$('#results [data-lazy]').forEach(mountLazy); markPlaying(); }, 120);
});

/* Écran « tous les titres d'un artiste » */
function vArtistTracks(){
  const a = S.artistByKey.get(S.params.key);
  if (!a) return '';
  $('#topTitle').textContent = a.name;
  const list = a.albums.flatMap(al => al.tracks.filter(t => norm(t.artist) === a.key || norm(al.artist) === a.key));
  const all = list.concat(a.tracks.filter(t => !list.includes(t)));
  S.libList = all;
  return `<div class="bar"><span class="muted">${plural(all.length, 'titre')}</span><button class="btn small" data-act="shuffleLib">${ic('shuffle')} Aléatoire</button></div>${rowsHTML(all)}`;
}


/* ======================================================================
   Appels venant d'Android
   ====================================================================== */
window.novaLibrary = raw => {
  if (N && N.hasPermission()) S.scannedWithPermission = true;
  buildLibrary(Array.isArray(raw) ? raw : []);
  loadHistory(); loadAccounts();
  S.ready = true;
  $('#boot').hidden = true; $('#gate').hidden = true; $('#shell').hidden = false;
  if (S.view === 'album' && !S.albumById.has(S.params.id)) { S.stack = []; S.view = 'home'; }
  render(window.scrollY);
  if (S.p.c) { S.qv = -1; tick(); }
};
window.novaEvent = ev => {
  if (!ev) return;
  if (ev.type === 'permission'){
    if (ev.ok){ S.permDenied = false; startScan(); }
    else {
      S.permDenied = true;
      toast('Accès refusé : tu peux l\'autoriser plus tard dans les paramètres.');
      if (S.view === 'library') render(window.scrollY);
    }
  } else if (ev.type === 'hidden'){
    if (isYt()) YTE.pause(); // YouTube : pas de lecture en arrière-plan
  } else if (ev.type === 'resume'){
    if (S.ready){
      loadHistory(); loadAccounts();
      if (N && N.hasPermission() && !S.tracks.length && !S.scannedWithPermission) startScan();
      else if (S.view === 'profile') render(window.scrollY);
      else if (S.view === 'home' && S.remote.at && Date.now() - S.remote.at > 300000) loadRemote(true);
    }
  } else if (ev.type === 'lastfm' || ev.type === 'listenbrainz'){
    const k = ev.type === 'lastfm' ? 'lfm' : 'lb';
    if (ev.ok){ S.form = null; S.remote = {}; toast((k === 'lfm' ? 'Last.fm' : 'ListenBrainz') + ' connecté : ' + ev.user); S.statsSrc = k; render(window.scrollY); if (!$('#player').hidden) paintPlayer(); }
    else {
      const err = $('#' + k + 'Err'), b = $('#' + k + 'Btn');
      if (err){ err.textContent = ev.error || 'Connexion impossible.'; err.hidden = false; }
      if (b){ b.disabled = false; b.textContent = k === 'lfm' ? 'Connecter Last.fm' : 'Connecter ListenBrainz'; }
    }
  } else if (ev.type === 'accounts'){
    loadAccounts(); S.remote = {}; if (S.view === 'profile') render(window.scrollY);
  }
};
window.novaBack = () => {
  if (!$('#sheet').hidden){ closeSheet(); return true; }
  if (!$('#player').hidden){ closePlayer(); return true; }
  if (back()) return true;
  if (S.view !== 'home' && !$('#shell').hidden){ nav('home', {}, false); return true; }
  return false;
};

function startScan(){
  if (!S.ready){ $('#gate').hidden = true; $('#boot').hidden = false; }
  else if (S.view === 'library') $('#main').innerHTML = `<div class="empty"><div class="spin"></div><span>Recherche de ta musique…</span></div>`;
  N.scan(false);
}

/* ======================================================================
   Démarrage
   ====================================================================== */
startIntro();
bindSeek();
setShuffle(S.shuffle);
paintRepeat();
document.addEventListener('visibilitychange', () => { if (document.hidden && isYt()) YTE.pause(); });
window.addEventListener('resize', () => layoutYT());
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 20), { passive: true });
$('#player').addEventListener('animationend', () => layoutYT()); // vidéo recalée une fois le lecteur ouvert
if (N){
  // Les fichiers du téléphone sont facultatifs : sans permission, on démarre sur les comptes
  if (N.hasPermission()) startScan();
  else window.novaLibrary([]);
  setInterval(tick, 500);
} else {
  $('#bootMsg').textContent = 'Nova Musique est une appli Android : installe l\'APK sur ton téléphone.';
}
</script>
